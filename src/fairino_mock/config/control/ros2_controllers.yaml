controller_manager:
  ros__parameters:
    update_rate: 625  # was 125; raised with ServoJ cmdT 0.008->0.0016 to run inside FR5 SDK recommended servo range [0.001-0.0016]s (625-1000Hz). Testing buffer/lurch fix 2026-08-27.

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_admittance_controller:
      type: joint_trajectory_admittance_controller/JointTrajectoryAdmittanceController

    # Stock JTC, loaded inactive, to compare path-tracking error against the
    # admittance controller. It shares the position command interface with the
    # JTAC, so only one of the two can be active at a time.
    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    velocity_force_controller:
      type: velocity_force_controller/VelocityForceController

    joint_velocity_controller:
      type: joint_velocity_controller/JointVelocityController

joint_state_broadcaster:
  ros__parameters:
    use_local_topics: false
    joints:
      - j1
      - j2
      - j3
      - j4
      - j5
      - j6
    interfaces:
      - position
      - velocity

joint_trajectory_admittance_controller:
  ros__parameters:
    planning_group_name: manipulator
    sensor_frame: wrist3_link
    ee_frame: tool0
    ft_sensor_name: ""
    stop_accelerations: [30.0, 30.0, 30.0, 30.0, 30.0, 30.0]
    ft_cutoff_frequency_ratio: 1.0
    ft_force_deadband: 0.0
    ft_torque_deadband: 0.0
    state_publish_rate: 50
    jacobian_damping: 0.01
    gravity_vector: [0.0, 0.0, -9.8]
    default_path_tolerance: 0.2
    default_goal_tolerance: 0.05
    default_absolute_force_torque_threshold: [45.0, 45.0, 45.0, 10.0, 10.0, 10.0]

joint_trajectory_controller:
  ros__parameters:
    joints:
      - j1
      - j2
      - j3
      - j4
      - j5
      - j6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    # Publishes per-joint position error on ~/controller_state. The `trajectory`
    # (path) tolerance mirrors the JTAC's default_path_tolerance so the two are
    # compared on equal terms; `goal` mirrors default_goal_tolerance.
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0
      j1: { trajectory: 0.15, goal: 0.05 }
      j2: { trajectory: 0.15, goal: 0.05 }
      j3: { trajectory: 0.15, goal: 0.05 }
      j4: { trajectory: 0.15, goal: 0.05 }
      j5: { trajectory: 0.15, goal: 0.05 }
      j6: { trajectory: 0.15, goal: 0.05 }

velocity_force_controller:
  ros__parameters:
    planning_group_name: manipulator
    ee_frame: tool0
    sensor_frame: wrist3_link
    ft_sensor_name: ""
    ft_force_deadband: 0.0
    ft_torque_deadband: 0.0
    max_joint_velocity:
      - 3.15
      - 3.15
      - 3.15
      - 3.2
      - 3.2
      - 3.2
    max_joint_acceleration:
      - 0.7
      - 0.7
      - 0.7
      - 0.7
      - 0.7
      - 0.7
    max_cartesian_velocity:
      - 0.25
      - 0.25
      - 0.25
      - 1.5707
      - 1.5707
      - 1.5707
    max_cartesian_acceleration:
      - 2.0
      - 2.0
      - 2.0
      - 4.0
      - 4.0
      - 4.0
    ft_cutoff_frequency_ratio: 1.0
    state_publish_rate: 50
    jacobian_damping: 0.001
    command_timeout: 0.2
    joint_limit_position_tolerance: 0.02

joint_velocity_controller:
  ros__parameters:
    planning_group_name: manipulator
    max_joint_velocity:
      - 3.15
      - 3.15
      - 3.15
      - 3.2
      - 3.2
      - 3.2
    max_joint_acceleration:
      - 0.7
      - 0.7
      - 0.7
      - 0.7
      - 0.7
      - 0.7
    command_interfaces: ["position"]
    joint_limit_position_tolerance: 0.02
    command_timeout: 0.2
    state_publish_rate: 20
